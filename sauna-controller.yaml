# ================================
# Climate control (PID -> windowed contactor)
# ================================
climate:
  - platform: pid
    id: sauna_climate
    name: "Sauna Climate"
    sensor: t_control
    default_target_temperature: 70 °C

    # PID heat output is NOT directly driving power; it is used as a duty request (pid_duty).
    heat_output: pid_heat_output

    control_parameters:
      kp: 0.15
      ki: 0.001
      kd: 0
      min_integral: -0.15
      max_integral: 0.15

    visual:
      min_temperature: 30
      max_temperature: 110
      temperature_step: 1

    deadband_parameters:
      threshold_high: 0.3
      threshold_low: -0.3
    

    
    on_state:
      - lambda: |-
          ESP_LOGD("PID", "p=%.3f i=%.3f d=%.3f out=%.3f",
            id(sauna_climate).get_proportional_term(),
            id(sauna_climate).get_integral_term(),
            id(sauna_climate).get_derivative_term(),
            id(sauna_climate).get_output_value());
          if (id(sauna_climate).mode == climate::CLIMATE_MODE_HEAT) {
            id(heat_request_ms) = millis();
          } else {
            id(heat_request_ms) = 0;
          }


script:
  - id: publish_telemetry
    mode: single
    then:
      - mqtt.publish_json:
          topic: ${mqtt_topic_base}/telemetry
          qos: 0
          payload: |-
            bool eta_learning_active = (
              id(sauna_climate).mode == climate::CLIMATE_MODE_HEAT &&
              !isnan(id(t_control).state) &&
              !isnan(id(t_outdoor).state) &&
              id(contactor_on)
            );

            double thermal_ua = NAN;
            double thermal_c = NAN;
            double thermal_tau = NAN;
            if (id(th_a) > 0.0) {
              thermal_ua = (-id(th_c)) / id(th_a);
              thermal_c = (1.0 / id(th_a)) / 1000.0;
            }
            if (id(th_c) < -1e-9) {
              thermal_tau = (-1.0 / id(th_c)) / 60.0;
            }

            std::string control_src = id(control_temp_source).current_option().c_str();
            if (control_src.empty()) control_src = "Average (Top+Head)";

            root["device_id"] = "${internalname}";
            JsonObject status = root["status"].to<JsonObject>();
            status["t_top_c"] = isnan(id(t_top).state) ? 0.0f : id(t_top).state;
            status["t_head_c"] = isnan(id(t_head).state) ? 0.0f : id(t_head).state;
            status["t_under_c"] = isnan(id(t_under).state) ? 0.0f : id(t_under).state;
            status["t_outdoor_c"] = isnan(id(t_outdoor).state) ? 0.0f : id(t_outdoor).state;
            status["t_control"] = isnan(id(t_control).state) ? 0.0f : id(t_control).state;
            status["strat_delta_c"] = isnan(id(d_strat).state) ? 0.0f : id(d_strat).state;
            status["mode"] = id(sauna_climate).mode == climate::CLIMATE_MODE_HEAT ? "HEAT" : "OFF";
            status["setpoint_c"] = id(sauna_climate).target_temperature;
            status["heater_power_pct"] = id(pid_duty) * 100.0f;
            status["fan_on"] = id(fan_destrat).state;
            status["light_on"] = id(sauna_light).current_values.is_on();
            status["amp_on"] = id(sauna_amp).state;
            status["contactor_active"] = id(contactor_on);
            status["boost_active"] = id(boost_active);
            status["sensor_fault"] = id(sensor_fault_active);
            status["power_w"] = isnan(id(sauna_power_w).state) ? 0.0f : id(sauna_power_w).state;
            status["heat_loss_w"] = isnan(id(sauna_heat_loss_w).state) ? 0.0f : id(sauna_heat_loss_w).state;
            status["heat_loss_kw"] = isnan(id(sauna_heat_loss_kw).state) ? 0.0f : id(sauna_heat_loss_kw).state;
            status["heating_headroom_kw"] = isnan(id(sauna_heating_headroom_kw).state) ? 0.0f : id(sauna_heating_headroom_kw).state;
            status["boost_window_c"] = id(boost_window).state;
            status["boost_exit_c"] = id(boost_exit).state;
            status["max_session_min"] = id(max_session_min).state;
            status["fan_dt_setpoint_c"] = id(fan_dt_sp).state;
            status["control_temp_source"] = control_src.c_str();
            status["control_temp_source_active"] = id(control_temp_source_active).state.c_str();
            status["control_temp_valid"] = isnan(id(control_temp_valid).state) ? 0.0f : id(control_temp_valid).state;
            status["oven_runtime_s"] = id(oven_runtime_s);
            status["fan_runtime_s"] = id(fan_runtime_s);
            status["light_runtime_s"] = id(light_runtime_s);
            status["amp_runtime_s"] = id(amp_runtime_s);
            status["energy_wh"] = isnan(id(sauna_energy_wh).state) ? 0.0f : id(sauna_energy_wh).state;
            status["energy_kwh"] = isnan(id(sauna_energy_kwh).state) ? 0.0f : id(sauna_energy_kwh).state;
            status["eta_model_a"] = isnan(id(eta_A_sensor).state) ? 0.0f : id(eta_A_sensor).state;
            status["eta_model_b"] = isnan(id(eta_B_sensor).state) ? 0.0f : id(eta_B_sensor).state;
            status["eta_auto_min"] = isnan(id(sauna_eta_min).state) ? 0.0f : id(sauna_eta_min).state;
            status["eta_pred_min"] = isnan(id(sauna_eta_min_pred).state) ? 0.0f : id(sauna_eta_min_pred).state;
            status["eta_samples"] = id(eta_n);
            status["eta_rmse"] = isnan(id(eta_rmse).state) ? 0.0f : id(eta_rmse).state;
            status["eta_confidence"] = isnan(id(eta_confidence).state) ? 0.0f : id(eta_confidence).state;
            status["eta_pred_rate"] = isnan(id(eta_rate_pred).state) ? 0.0f : id(eta_rate_pred).state;
            status["eta_learning_active"] = eta_learning_active;
            status["thermal_model_samples"] = id(th_n);
            status["thermal_ua"] = isnan(thermal_ua) ? 0.0f : (float) thermal_ua;
            status["thermal_c"] = isnan(thermal_c) ? 0.0f : (float) thermal_c;
            status["thermal_tau"] = isnan(thermal_tau) ? 0.0f : (float) thermal_tau;
            status["uptime_seconds"] = (unsigned long)(millis() / 1000);
            root["last_ack_id"] = id(last_ack_id);

# ================================
# Main control loop (safety, session, boost, windowing, models)
# Runs every 1s and is the "single source of truth" for heater behavior.
# ================================
interval:
  - interval: 1s
    then:
      - lambda: |-
          // ------------------------------------------------------------
          // Default: do not force climate off. We set this to true only
          // when a hard safety / watchdog condition demands it.
          // ------------------------------------------------------------
          id(force_climate_off) = false;

          const uint32_t now_ms = millis();

          // ------------------------------------------------------------
          // Track when HEAT mode was requested (edge detect).
          // This prevents the grace timer from resetting every second.
          // ------------------------------------------------------------
          if (id(sauna_climate).mode == climate::CLIMATE_MODE_HEAT) {
            if (!id(heat_mode_latched)) {
              id(heat_mode_latched) = true;
              id(heat_request_ms) = now_ms;         // when HEAT was first entered
              // Note: do NOT reset fault_heat_start_ms here; we want it to reflect
              // "time since sensors became faulty while HEAT is active".
            }
          } else {
            id(heat_mode_latched) = false;
            id(heat_request_ms) = 0;
            id(fault_heat_start_ms) = 0;            // not heating -> no need to count grace
          }

          // ------------------------------------------------------------
          // When not heating, we reset sensor "last OK" timestamps so that
          // entering HEAT requires fresh valid sensor readings.
          // ------------------------------------------------------------
          if (id(sauna_climate).mode != climate::CLIMATE_MODE_HEAT) {
            id(t_top_last_ok_ms) = 0;
            id(t_head_last_ok_ms) = 0;
          }

          // ------------------------------------------------------------
          // HARD SAFETY: absolute over-temperature cut-off (Top sensor).
          // This is independent of PID/windowing. It is a "kill switch".
          // ------------------------------------------------------------
          if (!isnan(id(t_top).state) && id(t_top).state > 120.0f) {
            id(sauna_contactor_hw).turn_off();
            id(contactor_on) = false;
            id(boost_active) = false;
            id(pid_duty) = 0.0f;
            id(window_start_ms) = 0;
            id(window_on_ms) = 0;

            id(force_climate_off) = true;  // also turn climate OFF to reflect reality in HA
            return;
          }

          // ------------------------------------------------------------
          // Sensor validity watchdog (DS18B20).
          // We reject NaN, -127°C-ish, 85.0°C power-up default, and extremes.
          // ------------------------------------------------------------
          auto temp_ok = [](float v) -> bool {
            if (isnan(v)) return false;
            if (v <= -100.0f) return false;             // DS18B20 often reports ~-127 on error
            if (fabsf(v - 85.0f) < 0.01f) return false; // DS18B20 power-up default is 85.0°C
            if (v < -40.0f || v > 150.0f) return false; // out of plausible range
            return true;
          };

          // Update "last OK timestamp" when we see plausible temperatures
          if (temp_ok(id(t_top).state))  id(t_top_last_ok_ms)  = now_ms;
          if (temp_ok(id(t_head).state)) id(t_head_last_ok_ms) = now_ms;

          // If we haven't seen plausible values recently, treat sensors as missing/faulty
          const uint32_t OK_TIMEOUT_MS = 15000UL;  // 15s without valid reading => fault
          const bool top_missing  = (id(t_top_last_ok_ms)  == 0) || (now_ms - id(t_top_last_ok_ms)  > OK_TIMEOUT_MS);
          const bool head_missing = (id(t_head_last_ok_ms) == 0) || (now_ms - id(t_head_last_ok_ms) > OK_TIMEOUT_MS);

          // ------------------------------------------------------------
          // If critical sensors are missing/faulty:
          //  - Heater is forced OFF immediately (contactor OFF)
          //  - Optional: after GRACE_MS in HEAT mode, climate is forced OFF
          //  - WARN log throttled to once per 10s
          // ------------------------------------------------------------
          if (top_missing || head_missing) {
            id(sensor_fault_active) = true;

            // Always force heater OFF while sensor fault exists
            id(sauna_contactor_hw).turn_off();
            id(contactor_on) = false;
            id(boost_active) = false;
            id(pid_duty) = 0.0f;
            id(window_start_ms) = 0;
            id(window_on_ms) = 0;

            // Throttled warning every 10 seconds (avoid log spam / blocking)
            const uint32_t LOG_INTERVAL_MS = 10000UL;
            if ((now_ms - id(sensor_fault_last_log_ms)) >= LOG_INTERVAL_MS) {
              ESP_LOGW("sauna",
                       "Sensor fault detected: top_missing=%d head_missing=%d (t_top=%.2f t_head=%.2f)",
                       (int) top_missing, (int) head_missing,
                       id(t_top).state, id(t_head).state);
              id(sensor_fault_last_log_ms) = now_ms;
            }

            // If user requested HEAT but sensors remain faulty beyond GRACE_MS, force climate OFF.
            // This prevents HA from showing "HEAT" while the controller refuses to heat.
            const uint32_t GRACE_MS = 30000UL;  // 30s grace after HEAT with bad sensors

            if (id(sauna_climate).mode == climate::CLIMATE_MODE_HEAT) {
              if (id(fault_heat_start_ms) == 0) id(fault_heat_start_ms) = now_ms;

              if ((now_ms - id(fault_heat_start_ms)) > GRACE_MS) {
                id(force_climate_off) = true;
              }
            } else {
              // Not in HEAT -> reset grace timer
              id(fault_heat_start_ms) = 0;
            }

            return;  // stop here; do NOT execute any heater/windowing logic
          }

          // Sensors look OK here
          id(sensor_fault_active) = false;
          id(fault_heat_start_ms) = 0;

          // ------------------------------------------------------------
          // If climate is not HEAT:
          //  - Heater is OFF and all heater logic is skipped
          //  - Fan logic and runtime counters still run
          // ------------------------------------------------------------
          if (id(sauna_climate).mode != climate::CLIMATE_MODE_HEAT) {
            id(sauna_contactor_hw).turn_off();
            id(contactor_on) = false;
            id(boost_active) = false;
            id(pid_duty) = 0.0f;
            id(window_start_ms) = 0;
            id(window_on_ms) = 0;
            id(session_start) = 0;

            // Destratification fan (allowed even when sauna is OFF)
            if (!isnan(id(d_strat).state)) {
              float d = id(d_strat).state;
              float sp = id(fan_dt_sp).state;

              const float HYST = 5.0f;
              float on_th  = sp + HYST;
              float off_th = sp - HYST;

              if (!id(fan_destrat).state && d >= on_th)
                id(fan_destrat).turn_on();
              else if (id(fan_destrat).state && d <= off_th)
                id(fan_destrat).turn_off();
            }

            // Runtime counters (seconds)
            if (id(fan_destrat).state)  id(fan_runtime_s)  += 1;
            if (id(sauna_amp).state)    id(amp_runtime_s)  += 1;
            if (id(sauna_light).current_values.is_on()) id(light_runtime_s) += 1;

            return;
          }

          // ------------------------------------------------------------
          // Session timer (only in HEAT). Enforces max run time.
          // ------------------------------------------------------------
          if (id(session_start) == 0) id(session_start) = now_ms;

          const uint32_t max_ms = (uint32_t)(id(max_session_min).state * 60000.0f);
          if ((now_ms - id(session_start)) > max_ms) {
            id(sauna_contactor_hw).turn_off();
            id(contactor_on) = false;
            id(boost_active) = false;
            id(pid_duty) = 0.0f;
            id(window_start_ms) = 0;
            id(window_on_ms) = 0;

            id(force_climate_off) = true;
            return;
          }

          // ------------------------------------------------------------
          // Boost logic (only in HEAT)
          // Boost overrides PID duty to 100% until close to setpoint or timeout.
          // ------------------------------------------------------------
          if (!isnan(id(t_control).state)) {
            float t  = id(t_control).state;
            float sp = id(sauna_climate).target_temperature;

            // Enter boost when far below setpoint
            if (!id(boost_active) && t < sp - id(boost_window).state) {
              id(boost_active) = true;
              id(boost_start) = now_ms;
            }

            // Exit boost when close enough to setpoint
            if (id(boost_active) && t >= sp - id(boost_exit).state) {
              id(boost_active) = false;
            }

            // Safety timeout for boost
            const uint32_t BOOST_MAX_MS = 25UL * 60UL * 1000UL;  // 25 minutes
            if (id(boost_active) && (now_ms - id(boost_start)) > BOOST_MAX_MS) {
              id(boost_active) = false;
            }
          } else {
            // If control temp is invalid, do not boost
            id(boost_active) = false;
          }

          // ------------------------------------------------------------
          // Windowed contactor control with min ON/OFF constraints.
          // This converts PID duty (0..1) into relay-friendly ON/OFF behavior.
          // ------------------------------------------------------------
          const uint32_t WINDOW_MS  = (uint32_t)(${contactor_window_s}  * 1000UL);
          const uint32_t MIN_ON_MS  = (uint32_t)(${contactor_min_on_s}  * 1000UL);
          const uint32_t MIN_OFF_MS = (uint32_t)(${contactor_min_off_s} * 1000UL);

          auto compute_on_ms = [&](float duty) -> uint32_t {
            // Sanitize PID duty and convert to ON time for the full window.
            if (isnan(duty)) duty = 0.0f;
            if (duty < 0.0f) duty = 0.0f;
            if (duty > 1.0f) duty = 1.0f;

            uint32_t on_ms = (uint32_t)(duty * (float)WINDOW_MS + 0.5f);

            // Enforce minimum ON pulse (if not zero)
            if (on_ms > 0 && on_ms < MIN_ON_MS) on_ms = MIN_ON_MS;

            // Clamp to window size
            if (on_ms > WINDOW_MS) on_ms = WINDOW_MS;

            // Enforce minimum OFF time (unless full ON)
            if (on_ms < WINDOW_MS && (WINDOW_MS - on_ms) < MIN_OFF_MS) {
              on_ms = WINDOW_MS - MIN_OFF_MS;
            }

            return on_ms;
          };

          // Latch on-time once per window to avoid relay chatter near threshold.
          if (id(window_start_ms) == 0) {
            id(window_start_ms) = now_ms;
            float duty = id(boost_active) ? 1.0f : id(pid_duty);
            id(window_on_ms) = compute_on_ms(duty);
          }

          uint32_t elapsed = now_ms - id(window_start_ms);
          if (elapsed >= WINDOW_MS) {
            id(window_start_ms) = now_ms;
            elapsed = 0;
            float duty = id(boost_active) ? 1.0f : id(pid_duty);
            id(window_on_ms) = compute_on_ms(duty);
          }

          // Boost should engage immediately, without waiting for next window rollover.
          if (id(boost_active) && id(window_on_ms) < WINDOW_MS) {
            id(window_on_ms) = WINDOW_MS;
          }

          const bool should_be_on = (id(window_on_ms) > 0) && (elapsed < id(window_on_ms));

          // Apply to hardware every cycle (prevents desync)
          if (should_be_on) {
            id(sauna_contactor_hw).turn_on();
            id(contactor_on) = true;
          } else {
            id(sauna_contactor_hw).turn_off();
            id(contactor_on) = false;
          }

          // ------------------------------------------------------------
          // Destratification fan control (simple hysteresis on dT).
          // ------------------------------------------------------------
          if (!isnan(id(d_strat).state)) {
            float d  = id(d_strat).state;
            float sp = id(fan_dt_sp).state;

            const float HYST = 5.0f;
            float on_th  = sp + HYST;
            float off_th = sp - HYST;

            if (!id(fan_destrat).state && d >= on_th)
              id(fan_destrat).turn_on();
            else if (id(fan_destrat).state && d <= off_th)
              id(fan_destrat).turn_off();
          }

          // ------------------------------------------------------------
          // Runtime counters (seconds).
          // These are simple integrators incremented once per second.
          // ------------------------------------------------------------
          if (id(contactor_on))         id(oven_runtime_s) += 1;
          if (id(fan_destrat).state)    id(fan_runtime_s)  += 1;
          if (id(sauna_amp).state)      id(amp_runtime_s)  += 1;
          if (id(sauna_light).current_values.is_on()) id(light_runtime_s) += 1;

          // ------------------------------------------------------------
          // ------------------------------------------------------------
          // ETA auto-calibration (online): learns rate = A + B*Tout.
          // PAUSE when sensor_fault_active (freeze learning; reset slope memory).
          // ------------------------------------------------------------
          if (!id(sensor_fault_active) &&
              id(sauna_climate).mode == climate::CLIMATE_MODE_HEAT &&
              !isnan(id(t_control).state) &&
              !isnan(id(t_outdoor).state) &&
              id(contactor_on)) {

            uint32_t now_ms2 = now_ms;

            if (id(eta_last_ms) == 0 || isnan(id(eta_last_t))) {
              id(eta_last_ms) = now_ms2;
              id(eta_last_t) = id(t_control).state;
            } else {
              float dmin = (now_ms2 - id(eta_last_ms)) / 60000.0f;

              if (dmin >= 5.0f) {
                float t_now = id(t_control).state;
                float dt = t_now - id(eta_last_t);

                id(eta_last_ms) = now_ms2;
                id(eta_last_t) = t_now;

                float rate_obs = dt / dmin;

                if (rate_obs > 0.2f && rate_obs < 2.0f) {
                  float sp = id(sauna_climate).target_temperature;
                  if (t_now < sp - 5.0f) {
                    float x = id(t_outdoor).state;
                    float y = rate_obs;

                    id(eta_n)   += 1;
                    id(eta_Sx)  += x;
                    id(eta_Sy)  += y;
                    id(eta_Sxx) += x * x;
                    id(eta_Sxy) += x * y;
                    id(eta_Syy) += y * y;

                    if (id(eta_n) >= 30) {
                      float n   = (float)id(eta_n);
                      float den = (n * id(eta_Sxx) - id(eta_Sx) * id(eta_Sx));

                      if (fabsf(den) > 1e-6f) {
                        float B = (n * id(eta_Sxy) - id(eta_Sx) * id(eta_Sy)) / den;
                        float A = (id(eta_Sy) - B * id(eta_Sx)) / n;

                        if (A < 0.10f) A = 0.10f;
                        if (A > 5.00f) A = 5.00f;
                        if (B < -0.05f) B = -0.05f;
                        if (B >  0.05f) B =  0.05f;

                        id(eta_A_est) = id(eta_A_est) * 0.95f + A * 0.05f;
                        id(eta_B_est) = id(eta_B_est) * 0.95f + B * 0.05f;
                      }
                    }
                  }
                }
              }
            }
          } else {
            // Not learning OR sensors faulty -> reset slope memory (avoid bogus dt on resume)
            id(eta_last_ms) = 0;
            id(eta_last_t) = NAN;
          }

          // ------------------------------------------------------------
          // Thermal model learning (online): dTin/dt = a*P + c*(Tin-Tout)
          // PAUSE when sensor_fault_active (freeze learning; reset slope memory).
          // ------------------------------------------------------------
          if (!id(sensor_fault_active) &&
              !isnan(id(t_control).state) &&
              !isnan(id(t_outdoor).state)) {

            uint32_t th_now = now_ms;

            if (id(th_last_ms) == 0 || isnan(id(th_last_tin))) {
              id(th_last_ms) = th_now;
              id(th_last_tin) = id(t_control).state;
            } else {
              float dsec = (th_now - id(th_last_ms)) / 1000.0f;

              if (dsec >= 5.0f) {
                float Tin  = id(t_control).state;
                float Tout = id(t_outdoor).state;

                float dTin = Tin - id(th_last_tin);
                float y = dTin / dsec;

                id(th_last_ms) = th_now;
                id(th_last_tin) = Tin;

                double P  = id(contactor_on) ? ((double)${power_of_sauna_oven} * 1000.0) : 0.0;
                double dT = (double)(Tin - Tout);

                if (fabsf(y) < 0.02f && P == 0.0) {
                  // skip
                } else if (y > 0.05f || y < -0.05f || fabsf(dT) > 1.0f) {
                  id(th_n)   += 1;
                  id(th_S11) += P * P;
                  id(th_S22) += dT * dT;
                  id(th_S12) += P * dT;
                  id(th_T1)  += P * (double)y;
                  id(th_T2)  += dT * (double)y;

                  if (id(th_n) >= 40) {
                    double S11 = id(th_S11), S22 = id(th_S22), S12 = id(th_S12);
                    double T1  = id(th_T1),  T2  = id(th_T2);

                    double det = S11 * S22 - S12 * S12;
                    if (fabs(det) > 1e-9) {
                      double a = ( T1 * S22 - T2 * S12) / det;
                      double c = ( S11 * T2 - S12 * T1) / det;

                      if (a > 0.0 && a < 1e-2 && c < 0.0 && c > -1e-2) {
                        id(th_a) = id(th_a) * 0.95 + a * 0.05;
                        id(th_c) = id(th_c) * 0.95 + c * 0.05;
                      }
                    }
                  }
                }
              }
            }
          } else {
            // Sensors faulty/missing OR invalid inputs -> reset slope memory only
            id(th_last_ms) = 0;
            id(th_last_tin) = NAN;
          }

      - if:
          condition:
            lambda: 'return id(force_climate_off);'
          then:
            - switch.turn_off: sauna_contactor_hw
            - climate.control:
                id: sauna_climate
                mode: 'OFF'


  # Publish telemetry snapshot to MQTT.
  - interval: 20s
    then:
      - script.execute: publish_telemetry
      

