services:
  db:
    image: postgres:16-alpine
    container_name: sauna_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    container_name: sauna_mqtt
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/certs:/mosquitto/certs:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log

  web:
    user: "1000:1000"
    build: ./web
    container_name: sauna_web
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    volumes:
      - ./web:/app
      - /var/lib/sauna/static:/app/staticfiles
      # mount entire project so we can read the ESPHome YAML
      - ./:/workspace:ro
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_ENGINE: ${DB_ENGINE}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      MQTT_ENABLED: ${MQTT_ENABLED:-1}
      MQTT_HOST: ${MQTT_HOST:-mqtt}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-sauna_mqtt}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-0}
      MQTT_TLS_CA_CERT: ${MQTT_TLS_CA_CERT:-}
      MQTT_TLS_INSECURE: ${MQTT_TLS_INSECURE:-0}
      MQTT_TELEMETRY_TOPIC: ${MQTT_TELEMETRY_TOPIC:-sauna/+/telemetry}
      MQTT_COMMAND_TOPIC_TEMPLATE: ${MQTT_COMMAND_TOPIC_TEMPLATE:-sauna/{device_id}/cmd}
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn sauna_site.wsgi:application --bind 0.0.0.0:8000 --workers 2
      "

  mqtt_worker:
    user: "1000:1000"
    build: ./web
    container_name: sauna_mqtt_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    volumes:
      - ./web:/app
    environment:
      DB_ENGINE: ${DB_ENGINE}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      MQTT_ENABLED: ${MQTT_ENABLED:-1}
      MQTT_HOST: ${MQTT_HOST:-mqtt}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-sauna_mqtt}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-0}
      MQTT_TLS_CA_CERT: ${MQTT_TLS_CA_CERT:-}
      MQTT_TLS_INSECURE: ${MQTT_TLS_INSECURE:-0}
      MQTT_TELEMETRY_TOPIC: ${MQTT_TELEMETRY_TOPIC:-sauna/+/telemetry}
      MQTT_COMMAND_TOPIC_TEMPLATE: ${MQTT_COMMAND_TOPIC_TEMPLATE:-sauna/{device_id}/cmd}
    command: >
      sh -c "
      python manage.py mqtt_bridge
      "

  telemetry_cleanup:
    user: "1000:1000"
    build: ./web
    container_name: sauna_telemetry_cleanup
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./web:/app
    environment:
      DB_ENGINE: ${DB_ENGINE}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost
    command: >
      sh -c "
      while true; do
        python manage.py cleanup_telemetry --days 7;
        sleep 86400;
      done
      "

volumes:
  postgres_data:
  mqtt_data:
  mqtt_log:
