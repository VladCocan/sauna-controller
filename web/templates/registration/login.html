{% load i18n %}
{% get_current_language as CURRENT_LANG %}
<!doctype html>
<html lang="{{ CURRENT_LANG }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% trans "Login" %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 420px;">
  <div class="d-flex justify-content-end mb-2">
    <form method="post" action="{% url 'set_language' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}" />
      <select name="language" class="form-select form-select-sm" onchange="this.form.submit()" aria-label="Language">
        <option value="ro" {% if CURRENT_LANG == "ro" %}selected{% endif %}>RO</option>
        <option value="en" {% if CURRENT_LANG == "en" %}selected{% endif %}>EN</option>
      </select>
    </form>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="h4 mb-3">{% trans "Sauna Login" %}</h1>

      {% if form.errors %}
        <div class="alert alert-danger">
          {% trans "Invalid username/password." %}
        </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">{% trans "Username" %}</label>
          <input class="form-control form-control-lg" type="text" name="username" autofocus required>
        </div>

        <div class="mb-3">
          <label class="form-label">{% trans "Password" %}</label>
          <input class="form-control form-control-lg" type="password" name="password" required>
        </div>

        <input type="hidden" name="next" value="{{ next }}"/>

        <div class="d-grid">
          <button class="btn btn-primary btn-lg" type="submit">{% trans "Login" %}</button>
        </div>
      </form>

      <div class="text-muted small mt-3">
        {% trans "Admin:" %} <a href="/admin/">/admin/</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
